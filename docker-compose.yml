services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork  # local-only credentials; not a secret
      POSTGRES_DB: groundwork
    ports:
      # Host 5433 so it doesn't collide with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://groundwork:groundwork@db:5432/groundwork
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
      - hf-cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s  # first start downloads model weights

  web:
    # nginx: serves the React build and proxies /api, /auth and /health to the api service, so
    # the browser sees one origin. Only /a/* (the widget) may be framed (frontend/nginx.conf).
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  hf-cache:
