# Serves the React build and proxies the API, so the browser sees one origin (no CORS).
# Framing (docs/security.md): only the widget route /a/* may be framed; everything else is
# frame-ancestors 'none', so the dashboard can't be embedded (clickjacking).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 10 MB PDFs plus multipart overhead. nginx's 1 MB default would reject uploads before
    # FastAPI could return its specific "This PDF is 12.4 MB. The limit is 10 MB." error.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API (same origin) ------------------------------------------------------------------
    location ~ ^/(api|auth)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backstop only: the API answers or gives up within ask_timeout_seconds (150 s).
        proxy_read_timeout 180s;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    location = /health {
        proxy_pass http://api:8000;
    }

    # --- Static assets (content-hashed) ---------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The JS embed, loaded by other sites with <script src> (no CORS needed); cached briefly.
    location = /embed.js {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # --- Widget: the only frameable route ---------------------------------------------------------
    location /a/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        # The URL contains the assistant token: never send it to other sites in Referer.
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # --- Everything else (landing, auth, dashboard): never frameable ----------------------------
    location / {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
